# Hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Monta o código do host e reinicia o processo a cada alteração (node --watch).
# Volumes anônimos preservam os node_modules instalados na imagem.
# Só aqui os serviços publicam porta no host (ADR 017). Dentro do contêiner, todos escutam na 3000.
x-node-dev: &node-dev
  command: ["node", "--watch", "src/main.js"]
  restart: "no"

x-python-dev: &python-dev
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3005", "--reload"]
  restart: "no"

services:
  rabbitmq:
    ports: ["15673:15672"] # UI de gestão; AMQP fica só na rede interna

  web:
    <<: *node-dev
    volumes:
      - ./web/src:/app/web/src
      - ./shared:/app/shared
      - /app/shared/node_modules

  registration:
    <<: *node-dev
    ports: ["3001:3000"]
    volumes:
      - ./registration/src:/app/registration/src
      - ./shared:/app/shared
      - /app/shared/node_modules

  secretariat:
    <<: *node-dev
    ports: ["3002:3000"]
    volumes:
      - ./secretariat/src:/app/secretariat/src
      - ./shared:/app/shared
      - /app/shared/node_modules

  identity:
    <<: *node-dev
    command: ["sh", "-c", "node scripts/migrate.js && node --watch src/main.js"]
    ports: ["3003:3000"]
    volumes:
      - ./identity/src:/app/identity/src
      - ./shared:/app/shared
      - /app/shared/node_modules

  payment:
    command: ["uv", "run", "--no-sync", "uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "3000"]
    restart: "no"
    ports: ["3004:3000"]
    volumes:
      - ./payment/src:/app/src

  certificate:
    <<: *python-dev
    volumes:
      - ./certificate/app:/app/app
