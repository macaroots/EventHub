openapi: 3.0.3
info:
  title: Identity
  version: 1.0.0
  description: Cadastro de usuários e login (emite o JWT usado pelos outros serviços).
servers:
  - url: http://localhost:3003
paths:
  /users:
    get:
      summary: Lista os usuários
      description: Público. Usado pelo BFF para traduzir ids em usernames.
      responses:
        '200':
          description: Usuários
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      summary: Cadastra um usuário (role `user`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Criado. Publica `UserCreated`.
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
  /auth:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: 'Token JWT (HS256, 8 h) para o header `Authorization: Bearer <token>`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '400': { $ref: '#/components/responses/Error' }
components:
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [user, admin] }
  responses:
    Error:
      description: Erro de domínio (mensagem)
      content:
        application/json:
          schema: { type: string }
