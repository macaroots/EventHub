# Docker Compose snippet for identity + identity-db
# Merge into your project-level docker-compose.yml or use as an override file.

services:

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: 2429
    volumes:
      - identity_db_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventhub

  identity:
    build:
      context: ..
      dockerfile: identity/Dockerfile
      
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql://identity_user:2429@identity-db:5432/identity_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventhub

  # RabbitMQ – shared broker (define once in your top-level compose)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eventhub

volumes:
  identity_db_data:

networks:
  eventhub:
    driver: bridge

