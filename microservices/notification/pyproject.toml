[project]
name = "notification-service"
version = "0.1.0"
description = "Notificações assíncronas de compras do EventHub"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "aio-pika>=9.4,<11", "PyJWT>=2.9,<3", "email-validator>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
