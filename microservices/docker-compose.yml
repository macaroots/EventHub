x-service: &service
  restart: unless-stopped
  environment: &env
    RABBITMQ_URL: amqp://rabbitmq
    JWT_SECRET: ${JWT_SECRET} # mesmo segredo em todos (HS256)
    INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN} # rotas /internal do identity (serviço a serviço)
    PORT: 3000 # mesma porta em todos: cada contêiner tem IP próprio na rede interna
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  web:
    <<: *service
    build: { context: ., dockerfile: web/Dockerfile }
    environment: { <<: *env, IDENTITY_URL: http://identity:3000, SECRETARIAT_URL: http://secretariat:3000, REGISTRATION_URL: http://registration:3000, PAYMENT_URL: http://payment:3000, REPORTS_URL: http://reports:3006, CERTIFICATE_URL: http://certificate:3005, NOTIFICATION_URL: http://notification:3006 }
    depends_on:
      notification-worker: { condition: service_healthy }
    ports: ["3000:3000"] # única entrada publicada (ADR 017)

  registration:
    <<: *service
    environment: { <<: *env, PAYMENT_WINDOW_MINUTES: 2 }
    depends_on:
      notification-worker: { condition: service_healthy }
      reports: { condition: service_healthy }
    build: { context: ., dockerfile: registration/Dockerfile }
    volumes:
      - registration-data:/app/registration/data

  secretariat:
    <<: *service
    depends_on:
      reports: { condition: service_healthy }
    build: { context: ., dockerfile: secretariat/Dockerfile }
    volumes:
      - secretariat-data:/app/secretariat/data

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: identity, POSTGRES_USER: identity, POSTGRES_PASSWORD: "${IDENTITY_DB_PASSWORD}" }
    ports: ["5433:5432"]
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    <<: *service
    build: { context: ., dockerfile: identity/Dockerfile }
    command: ["sh", "-c", "node scripts/migrate.js && node src/main.js"]
    environment:
      <<: *env
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      rabbitmq: { condition: service_healthy }
      identity-db: { condition: service_healthy }

  payment:
    <<: *service
    build: { context: ., dockerfile: payment/Dockerfile }
    environment:
      <<: *env
      DB_PATH: /app/payment/data/payments.db
      PAYMENT_TIMEOUT_MINUTES: 2
    depends_on:
      notification-worker: { condition: service_healthy }
      reports: { condition: service_healthy }
    volumes:
      - payment-data:/app/payment/data

  notification:
    build: { context: ./notification }
    environment: &notification-env
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://rabbitmq
      NOTIFICATION_DB_PATH: /app/data/notifications.db
      EMAIL_MODE: ${NOTIFICATION_EMAIL_MODE:-smtp}
      SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-mailpit}
      SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-1025}
      SMTP_FROM: ${NOTIFICATION_SMTP_FROM:-no-reply@eventhub.test}
      SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${NOTIFICATION_SMTP_STARTTLS:-false}
      SMTP_SSL: ${NOTIFICATION_SMTP_SSL:-false}
    volumes: ["notification-data:/app/data"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  notification-worker:
    build: { context: ./notification }
    command: ["uv", "run", "--no-sync", "python", "-m", "src.worker"]
    environment: *notification-env
    volumes: ["notification-data:/app/data"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,time,sys; db=sqlite3.connect('/app/data/notifications.db'); row=db.execute('select heartbeat from worker_health where id=1').fetchone(); sys.exit(0 if row and time.time()-row[0]<45 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8026:8025"]

  certificate:
    <<: *service
    depends_on:
      notification-worker: { condition: service_healthy }
    build: { context: ., dockerfile: certificate/Dockerfile }
    environment:
      <<: *env
      PORT: &certificate-port 3005
      PUBLIC_BASE_URL: http://localhost:3005
    ports: [{ published: *certificate-port, target: *certificate-port }]
    volumes:
      - certificate-data:/app/data

  reports:
    <<: *service
    build: { context: ., dockerfile: reports/Dockerfile }
    environment:
      <<: *env
      PORT: 3006
      REPORTS_BOOTSTRAP_EVENTS_DB: /snapshots/secretariat/secretariat.db
      REPORTS_BOOTSTRAP_REGISTRATION_DB: /snapshots/registration/registration.db
      REPORTS_BOOTSTRAP_PAYMENT_DB: /snapshots/payment/payments.db
    volumes:
      - reports-data:/app/data
      - secretariat-data:/snapshots/secretariat:ro
      - registration-data:/snapshots/registration:ro
      - payment-data:/snapshots/payment:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=json.load(urllib.request.urlopen('http://localhost:3006/health',timeout=3)); sys.exit(0 if r['status']=='ok' else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  notification-data:
  reports-data:
  secretariat-data:
  certificate-data:
  registration-data:
  identity-db-data:
  payment-data:
