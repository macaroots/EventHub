x-service: &service
  restart: unless-stopped
  environment: &env
    RABBITMQ_URL: amqp://rabbitmq
    JWT_SECRET: ${JWT_SECRET} # mesmo segredo em todos (HS256)
    INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN} # rotas /internal do identity (serviço a serviço)
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["15673:15672"] # AMQP só na rede interna; UI de gestão em :15673
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  web:
    <<: *service
    build: { context: ., dockerfile: web/Dockerfile }
    environment: { <<: *env, PORT: &web-port 3000, IDENTITY_URL: http://identity:3003, SECRETARIAT_URL: http://secretariat:3002, REGISTRATION_URL: http://registration:3001, PAYMENT_URL: http://payment:3004 }
    ports: [{ published: *web-port, target: *web-port }]

  registration:
    <<: *service
    build: { context: ., dockerfile: registration/Dockerfile }
    environment: { <<: *env, PORT: &registration-port 3001 }
    ports: [{ published: *registration-port, target: *registration-port }]
    volumes:
      - registration-data:/app/registration/data

  secretariat:
    <<: *service
    build: { context: ., dockerfile: secretariat/Dockerfile }
    environment: { <<: *env, PORT: &secretariat-port 3002 }
    ports: [{ published: *secretariat-port, target: *secretariat-port }]
    volumes:
      - secretariat-data:/app/secretariat/data

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: identity, POSTGRES_USER: identity, POSTGRES_PASSWORD: "${IDENTITY_DB_PASSWORD}" }
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    <<: *service
    build: { context: ., dockerfile: identity/Dockerfile }
    command: ["sh", "-c", "node scripts/migrate.js && node src/main.js"]
    environment:
      <<: *env
      PORT: &identity-port 3003
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000
    ports: [{ published: *identity-port, target: *identity-port }]
    depends_on:
      rabbitmq: { condition: service_healthy }
      identity-db: { condition: service_healthy }

  payment:
    <<: *service
    build: { context: ., dockerfile: payment/Dockerfile }
    environment: { <<: *env, PORT: &payment-port 3004 }
    ports: [{ published: *payment-port, target: *payment-port }]
    volumes:
      - payment-data:/app/payment/data

volumes:
  secretariat-data:
  registration-data:
  identity-db-data:
  payment-data:
