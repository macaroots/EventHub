x-service: &service
  restart: unless-stopped
  environment: &env
    RABBITMQ_URL: amqp://rabbitmq
    JWT_SECRET: ${JWT_SECRET}
    INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["15673:15672"] # AMQP só na rede interna; UI de gestão em :15673
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  web:
    <<: *service
    build: { context: ., dockerfile: web/Dockerfile }
    environment: { <<: *env, PORT: &web-port 3000, IDENTITY_URL: http://identity:3003, SECRETARIAT_URL: http://secretariat:3002, REGISTRATION_URL: http://registration:3001, PAYMENT_URL: http://payment:3004 }
    ports: [{ published: *web-port, target: *web-port }]

  registration:
    <<: *service
    build: { context: ., dockerfile: registration/Dockerfile }
    environment: { <<: *env, PORT: &registration-port 3001 }
    ports: [{ published: *registration-port, target: *registration-port }]

  secretariat:
    <<: *service
    build: { context: ., dockerfile: secretariat/Dockerfile }
    environment: { <<: *env, PORT: &secretariat-port 3002 }
    ports: [{ published: *secretariat-port, target: *secretariat-port }]
    volumes:
      - secretariat-data:/app/secretariat/data

  identity:
    <<: *service
    build: { context: ., dockerfile: identity/Dockerfile }
    environment: { <<: *env, PORT: &identity-port 3003, ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}", ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}" }
    ports: [{ published: *identity-port, target: *identity-port }]

  payment:
    <<: *service
    build: { context: ., dockerfile: payment/Dockerfile }
    environment: { <<: *env, PORT: &payment-port 3004 }
    ports: [{ published: *payment-port, target: *payment-port }]

  certificate:
    <<: *service
    build: { context: ., dockerfile: certificate/Dockerfile }
    environment:
      <<: *env
      PORT: &certificate-port 3005
      PUBLIC_BASE_URL: http://localhost:3005
    ports: [{ published: *certificate-port, target: *certificate-port }]
    volumes:
      - certificate-data:/app/data

volumes:
  secretariat-data:
  certificate-data:
