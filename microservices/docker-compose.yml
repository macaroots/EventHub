x-service: &service
  restart: unless-stopped
  environment: &env
    RABBITMQ_URL: amqp://rabbitmq
    JWT_SECRET: ${JWT_SECRET} # mesmo segredo em todos (HS256)
    INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN} # rotas /internal do identity (serviço a serviço)
    PORT: 3000 # mesma porta em todos: cada contêiner tem IP próprio na rede interna
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  web:
    <<: *service
    build: { context: ., dockerfile: web/Dockerfile }
    environment: { <<: *env, IDENTITY_URL: http://identity:3000, SECRETARIAT_URL: http://secretariat:3000, REGISTRATION_URL: http://registration:3000, PAYMENT_URL: http://payment:3000 }
    ports: ["3000:3000"] # única entrada publicada (ADR 017)

  registration:
    <<: *service
    build: { context: ., dockerfile: registration/Dockerfile }
    volumes:
      - registration-data:/app/registration/data

  secretariat:
    <<: *service
    build: { context: ., dockerfile: secretariat/Dockerfile }
    volumes:
      - secretariat-data:/app/secretariat/data

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: identity, POSTGRES_USER: identity, POSTGRES_PASSWORD: "${IDENTITY_DB_PASSWORD}" }
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    <<: *service
    build: { context: ., dockerfile: identity/Dockerfile }
    command: ["sh", "-c", "node scripts/migrate.js && node src/main.js"]
    environment:
      <<: *env
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      rabbitmq: { condition: service_healthy }
      identity-db: { condition: service_healthy }

  payment:
    <<: *service
    build: { context: ., dockerfile: payment/Dockerfile }
    volumes:
      - payment-data:/app/payment/data

  certificate:
    <<: *service
    build: { context: ., dockerfile: certificate/Dockerfile }
    environment:
      <<: *env
      PORT: &certificate-port 3005
      PUBLIC_BASE_URL: http://localhost:3005
    ports: [{ published: *certificate-port, target: *certificate-port }]
    volumes:
      - certificate-data:/app/data

  reports:
    <<: *service
    build: { context: ., dockerfile: reports/Dockerfile }
    environment:
      <<: *env
      PORT: &reports-port 3006
      REPORTS_CURRENCY: BRL
    ports: [{ published: *reports-port, target: *reports-port }]
    volumes:
      - reports-data:/app/data

volumes:
  secretariat-data:
  certificate-data:
  registration-data:
  identity-db-data:
  payment-data:
  reports-data:
